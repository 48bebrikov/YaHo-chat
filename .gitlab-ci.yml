# Стадия тестов: pytest (без импорта gemini_engine/rag/embedder — тяжёлые зависимости)
test_imports:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - pytest -q

deploy_to_vps:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    # Добавляем приватный SSH ключ из переменных GitLab
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Добавляем IP сервера в known_hosts, чтобы SSH не спрашивал подтверждение
    - ssh-keyscan $VPS_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    # Копируем файл с переменными из GitLab CI (File variable ENV_FILE) на сервер
    - scp $ENV_FILE $SSH_USER@$VPS_IP:~/yoho-chat/.env
    # Подключаемся к серверу, стягиваем новый код и перезапускаем Docker
    - ssh $SSH_USER@$VPS_IP "cd ~/yoho-chat && git pull origin main && docker compose up -d --build"
  only:
    - main
