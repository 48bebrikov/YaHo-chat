stages:
  - lint
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# Стадия линтинга: проверяет синтаксис Python-кода с помощью flake8
flake8:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install flake8
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

# Стадия сборки: пробуем собрать Docker образ (чтобы убедиться, что он билдится)
build_docker:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE/userbot:latest .
  
# Стадия тестов: (в будущем сюда можно добавить pytest)
test_imports:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - python -c "import config"
    # Остальные импорты (Qdrant, Gemini) убраны, так как при их загрузке 
    # происходит попытка соединиться с БД, которая не запущена в CI-среде.

# Автоматический деплой на VPS сервер по SSH
# Запускается только для ветки main, если все предыдущие стадии (lint, build, test) прошли успешно
deploy_to_vps:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    # Добавляем приватный SSH ключ из переменных GitLab
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Добавляем IP сервера в known_hosts, чтобы SSH не спрашивал подтверждение
    - ssh-keyscan $VPS_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    # Подключаемся к серверу, переходим в папку проекта, стягиваем новый код и перезапускаем Docker
    # Переменная SSH_USER обычно равна root или вашему имени пользователя на VPS
    - ssh $SSH_USER@$VPS_IP "cd ~/yoho-chat && git pull origin main && docker-compose up -d --build"
  only:
    - main
