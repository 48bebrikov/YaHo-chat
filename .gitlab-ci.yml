# Tests: pytest (chat_engine/rag/embedder stay mocked — heavy deps)
test_imports:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - pytest -q

deploy_to_vps:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    # Load the private SSH key from GitLab CI variables
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Add the server IP to known_hosts so SSH does not prompt
    - ssh-keyscan $VPS_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    # Copy the GitLab CI file variable ENV_FILE onto the server
    - scp $ENV_FILE $SSH_USER@$VPS_IP:~/yoho-chat/.env
    # Pull the new code on the server and restart Docker
    - ssh $SSH_USER@$VPS_IP "cd ~/yoho-chat && git pull origin main && docker compose up -d --build"
  only:
    - main
