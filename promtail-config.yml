server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
    pipeline_stages:
      # Склеиваем traceback и прочие строки без таймстампа с предыдущей строкой лога.
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2},\d{3}\s+-\s+[A-Z]+\s+-\s'
          max_wait_time: 3s
      # Парсинг формата Python logging: "2026-04-17 10:20:49,239 - ERROR - text"
      # (?s) — точка захватывает переводы строк внутри одного события после multiline.
      - regex:
          expression: '^(?P<time>\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2},\d{3})\s+-\s+(?P<level>[A-Z]+)\s+-\s+(?P<message>(?s).*)$'
      - labels:
          level: