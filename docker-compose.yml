version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: yaho_qdrant
    ports:
      # Порт открыт в интернет, но защищен паролем (API-ключом)
      - "6333:6333"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  userbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yaho_userbot
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      # Пробрасываем локальную папку database/ внутрь, чтобы сохранить SQLite и файл сессии Telethon при перезапусках контейнера
      - ./database:/app/database
      - ./userbot_session.session:/app/userbot_session.session
    restart: unless-stopped
    # Используем stdin/stdout, так как Telethon при первом запуске требует ввода номера телефона и кода
    stdin_open: true
    tty: true

  prometheus:
    image: prom/prometheus:latest
    container_name: yaho_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: yaho_grafana
    ports:
      # Графану оставляем доступной из интернета, чтобы вы могли смотреть графики по IP:3000
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  qdrant_data: