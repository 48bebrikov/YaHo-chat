services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: yaho_qdrant
    ports:
      - "6333:6333"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  userbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yaho_userbot
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
    volumes:
      # Persist SQLite and the Telethon session across container restarts
      - ./database:/app/database
      - ./userbot_session.session:/app/userbot_session.session
    restart: unless-stopped
    # stdin/stdout: Telethon needs a phone number and code on first login
    stdin_open: true
    tty: true

  prometheus:
    image: prom/prometheus:latest
    container_name: yaho_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: yaho_grafana
    ports:
      # Grafana UI on host:3000
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: yaho_loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: yaho_promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  qdrant_data:
  grafana_data:
